spring.application.name=job-portal-test

# Test database (H2 in PostgreSQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
SPRING_DATASOURCE_URL=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Security / JWT test secret
app.jwt.secret=test-jwt-secret-for-tests-is-long-enough-and-stable-123456789

# Disable demo seeding in tests; tests create their own data
SEED_ENABLED=false

# Disable external service configuration in tests
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@example.com
spring.mail.password=test-password
MAIL_API_KEY=test-mail-api-key
OPENAI_API_KEY=test-openai-key
GOOGLE_API_KEY=test-google-api-key
GEMINI_MODEL=gemini-2.0-flash
SUPABASE_URL=http://localhost:9999
SUPABASE_SERVICE_ROLE_KEY=test-service-role-key

# Multipart limits (kept small for tests)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB